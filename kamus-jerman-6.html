<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Vokabelkasten" />
<meta name="theme-color" content="#F6F2E7" />
<title>Vokabelkasten</title>
<style>
  :root{
    --paper:#F6F2E7; --ink:#2A2620; --ink-soft:#6B6459; --line:#D8D0BC; --card:#FFFDF7;
    --der-bg:#2F4E8C; --der-fg:#EAF0FF;
    --die-bg:#B23A34; --die-fg:#FFEFEC;
    --das-bg:#3E7A55; --das-fg:#EAFBEF;
    --none-bg:#6B6459; --none-fg:#F5F1E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:'Helvetica Neue',Arial,sans-serif; -webkit-tap-highlight-color:transparent;}
  #app{min-height:100dvh;display:flex;flex-direction:column;}
  header{padding:20px 18px 12px;display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--line);}
  .eyebrow{font-size:10.5px;letter-spacing:.14em;color:#8C6A3F;font-weight:700;margin-bottom:2px;}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em;}
  .header-meta{font-size:11.5px;color:var(--ink-soft);text-align:right;line-height:1.5;}
  nav.tabbar{display:flex;gap:6px;padding:10px 14px;background:#EFE9D8;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:5;}
  .tabbtn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px 8px 0 0;border:none;
    background:transparent;color:var(--ink-soft);font-size:13.5px;font-weight:600;cursor:pointer;}
  .tabbtn.active{background:var(--card);color:var(--ink);box-shadow:0 -1px 0 0 var(--der-bg) inset;}
  main{flex:1;padding:16px 14px 48px;max-width:720px;width:100%;margin:0 auto;}
  .hidden{display:none !important;}

  input,select{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    font-size:14px;color:var(--ink);width:100%;font-family:inherit;}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--der-bg);outline-offset:2px;}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:8px;border:none;
    font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .btn-primary{background:var(--der-bg);color:var(--der-fg);}
  .btn-warn{background:#B23A34;color:#FFEFEC;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600;}
  .icon-btn{padding:7px;border-radius:7px;border:1px solid var(--line);background:var(--card);
    color:var(--ink-soft);cursor:pointer;display:inline-flex;}
  .icon-btn-danger{padding:7px;border-radius:7px;border:1px solid #E3B4AF;background:#FBEDEB;
    color:#B23A34;cursor:pointer;display:inline-flex;}

  .tag{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px;letter-spacing:.02em;flex-shrink:0;}
  .tag-der{background:var(--der-bg);color:var(--der-fg);}
  .tag-die{background:var(--die-bg);color:var(--die-fg);}
  .tag-das{background:var(--das-bg);color:var(--das-fg);}
  .tag-none{background:var(--none-bg);color:var(--none-fg);}
  .tag-guess{outline:1.5px dashed currentColor; outline-offset:1px;}

  /* Kamus */
  #kamus-wrap{display:flex;flex-direction:column;gap:14px;}
  .cat-section{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;}
  .cat-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
    background:transparent;border:none;cursor:pointer;color:var(--ink);}
  .cat-header-left{display:flex;align-items:center;gap:8px;}
  .chev{transition:transform .12s ease;display:inline-block;}
  .chev.closed{transform:rotate(-90deg);}
  .cat-name{font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:700;}
  .cat-count{font-size:11.5px;color:var(--ink-soft);background:#EFE9D8;border-radius:999px;padding:2px 8px;}
  .word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 12px 12px;}
  .word-card{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#FCFAF2;cursor:pointer;text-align:left;font-family:inherit;width:100%;}
  .word-card:active{background:#F5EFDD;}

  /* Modal detail kata */
  .modal-overlay{position:fixed;inset:0;background:rgba(42,38,32,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
  .modal-overlay.hidden{display:none !important;}
  .modal-sheet{background:var(--card);border-radius:16px 16px 0 0;padding:18px 18px 26px;width:100%;max-width:480px;max-height:82dvh;overflow-y:auto;}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;}
  .modal-word{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;}
  .modal-arti{font-size:13.5px;color:var(--ink-soft);margin-bottom:4px;}
  .modal-jamak{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .modal-jamak b{color:var(--ink);}
  .deklinasi-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .deklinasi-table th,.deklinasi-table td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;}
  .deklinasi-table th{color:var(--ink-soft);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
  .deklinasi-note{font-size:10.5px;color:var(--ink-soft);font-style:italic;margin-top:10px;}
  @media (min-width:560px){ .modal-overlay{align-items:center;} .modal-sheet{border-radius:16px;} }
  .word-de{font-size:14px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;}
  .word-id{font-size:12px;color:var(--ink-soft);overflow-wrap:anywhere;}
  .empty-state{text-align:center;padding:40px 18px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:10px;font-size:13.5px;}
  .empty-row{font-size:13px;color:var(--ink-soft);padding:8px 4px;}

  /* Kelola */
  #kelola-wrap{display:flex;flex-direction:column;gap:24px;}
  .section-title{font-family:Georgia,'Times New Roman',serif;font-size:15.5px;font-weight:700;margin:0 0 10px;}
  .cat-list{display:flex;flex-direction:column;gap:6px;}
  .cat-list-row{display:flex;align-items:center;gap:6px;}
  .cat-list-btn{flex:1;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;
    border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13.5px;
    font-weight:600;cursor:pointer;text-align:left;font-family:inherit;}
  .cat-list-btn.active{border-color:var(--der-bg);box-shadow:0 0 0 1px var(--der-bg);}
  .cat-list-count{font-size:11px;color:var(--ink-soft);font-weight:500;}
  .new-cat-row{display:flex;gap:6px;margin-top:8px;}
  .word-form{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#FCFAF2;margin-bottom:12px;}
  .artikel-picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .artikel-pick-btn{padding:6px 11px;border-radius:7px;border:1.5px solid;font-size:12.5px;font-weight:700;cursor:pointer;background:transparent;color:var(--ink);font-family:inherit;}
  .guess-note{font-size:11px;color:var(--ink-soft);font-style:italic;}
  .field-row{display:flex;gap:6px;align-items:center;}
  .field-row input{flex:1;}
  .translate-btn{flex-shrink:0;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;}
  .warning-box{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:8px;background:#FBEDEB;border:1px solid #E3B4AF;color:#7A2A25;font-size:13px;}
  .warning-actions{display:flex;gap:8px;}
  .word-form-actions{display:flex;gap:8px;margin-top:2px;}
  .manage-word-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);margin-bottom:6px;}
  .manage-word-body{flex:1;min-width:0;}
  .manage-word-actions{display:flex;gap:6px;}

  /* Flashcard */
  #flash-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .flash-controls{display:flex;gap:8px;width:100%;justify-content:space-between;flex-wrap:wrap;}
  .flash-counter{font-size:12.5px;color:var(--ink-soft);}
  .flash-stage{width:100%;max-width:320px;height:220px;perspective:1200px;cursor:pointer;}
  .flash-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s cubic-bezier(.4,.2,.2,1);}
  .flash-card.flipped{transform:rotateY(180deg);}
  .flash-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);backface-visibility:hidden;
    box-shadow:0 3px 0 0 #E6DFC8,0 8px 18px -6px rgba(42,38,32,.25);padding:20px;text-align:center;}
  .flash-face-back{transform:rotateY(180deg);background:#EFE9D8;}
  .flash-word{font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;word-break:break-word;}
  .flash-hint{font-size:11px;color:var(--ink-soft);}
  .flash-nav{display:flex;gap:10px;}
  .nav-btn{padding:10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;}
  .confirm-row{display:flex;gap:4px;}
</style>
</head>
<body>
<div id="app">

    <div>
      <div class="eyebrow">KARTEIKASTEN · DEUTSCH</div>

  <main>
    <section id="kamus-wrap"></section>
    <section id="kelola-wrap" class="hidden"></section>
    <section id="flash-wrap" class="hidden"></section>
  </main>
  <div id="word-modal-overlay" class="modal-overlay hidden"></div>
</div>

const SEED = {

    {id:"cat-lebensmittel", name:"Lebensmittel", words:[
      {id:"w1", artikel:"das", wort:"Brot", arti:"roti", jamak:"Brote"},

function uid(p){ return p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sortWords(words){ return [...words].sort((a,b)=>a.wort.localeCompare(b.wort,"de")); }
function norm(s){ return String(s||"").trim().toLowerCase(); }

/* ---- Kamus internal kata umum: artikel & jamak yang sudah pasti benar (dicek duluan sebelum menebak) ---- */

  spiegel:{artikel:"der",jamak:"Spiegel"}, sofa:{artikel:"das",jamak:"Sofas"}, regal:{artikel:"das",jamak:"Regale"},

  schwester:{artikel:"die",jamak:"Schwestern"}, bruder:{artikel:"der",jamak:"Brüder"}, tochter:{artikel:"die",jamak:"Töchter"},
  sohn:{artikel:"der",jamak:"Söhne"}, tante:{artikel:"die",jamak:"Tanten"}, onkel:{artikel:"der",jamak:"Onkel"},
  cousine:{artikel:"die",jamak:"Cousinen"}, cousin:{artikel:"der",jamak:"Cousins"}, kind:{artikel:"das",jamak:"Kinder"},

function lookupKnownWord(wort){ return KNOWN_NOMEN[norm(wort)] || null; }

/* ---- Tebakan artikel: cek kamus internal dulu, baru heuristik akhiran kata (bukan aturan pasti) ---- */
function guessArtikel(wort){
  const known = lookupKnownWord(wort);
  if(known) return known.artikel;
  const w = norm(wort);
  if(!w) return "";
  const dasEnd = ["chen","lein","tum","ment","um","o","ma"];
  const dieEnd = ["ung","heit","keit","schaft","tion","sion","tät","ie","ik","enz","anz","ur","ei","in","ine"];
  const derEnd = ["er","el","ig","ich","ling","or","ismus","us","ant","ent","eur","ist"];
  for(const suf of dasEnd) if(w.endsWith(suf)) return "das";
  for(const suf of dieEnd) if(w.endsWith(suf)) return "die";
  for(const suf of derEnd) if(w.endsWith(suf)) return "der";
  if(w.endsWith("e")) return "die";
  return "";
}

/* ---- Tebakan bentuk jamak: cek kamus internal dulu, baru heuristik akhiran kata (bukan aturan pasti) ---- */
function guessPlural(wort, artikel){
  const known = lookupKnownWord(wort);
  if(known && known.jamak) return known.jamak;
  const w = String(wort||"").trim();
  if(!w) return "";
  const lower = w.toLowerCase();
  if(artikel==="die"){
    if(lower.endsWith("in")) return w+"nen";
    if(/(ung|heit|keit|schaft|tion|sion|tät|ur|ik|enz|anz)$/.test(lower)) return w+"en";
    if(lower.endsWith("e")) return w+"n";
    return w+"en";
  }
  if(artikel==="der"){
    if(lower.endsWith("e")) return w+"n";
    if(/(er|el|en|chen|lein)$/.test(lower)) return w;
    if(lower.endsWith("ling")) return w+"e";
    if(lower.endsWith("us")) return w.slice(0,-2)+"en";
    if(/(ent|ant|ist|or|eur|ismus)$/.test(lower)) return w+"en";
    return w+"e";
  }
  if(artikel==="das"){
    if(/(chen|lein)$/.test(lower)) return w;
    if(lower.endsWith("um")) return w.slice(0,-2)+"en";
    if(lower.endsWith("ment")) return w+"e";
    if(/(er|el|en)$/.test(lower)) return w;
    return w+"e";
  }
  return "";
}

/* ---- Tabel deklinasi (artikel tentu, pola umum — kata benda tak beraturan bisa berbeda) ---- */
const ARTIKEL_DEKLINASI = {
  der:{nom:"der",gen:"des",dat:"dem",akk:"den"},
  die:{nom:"die",gen:"der",dat:"der",akk:"die"},
  das:{nom:"das",gen:"des",dat:"dem",akk:"das"},
};
const PLURAL_DEKLINASI = {nom:"die",gen:"der",dat:"den",akk:"die"};
function nomenGenitivSingular(wort, artikel){
  if(artikel!=="der" && artikel!=="das") return wort;
  const lower = wort.toLowerCase();
  if(/(s|ß|x|z|sch)$/.test(lower)) return wort+"es";
  return wort+"s";
}
function nomenDativPlural(jamak){
  if(!jamak) return jamak;
  if(/[ns]$/i.test(jamak)) return jamak;
  return jamak+"n";
}
function buildDeklinasiTable(word){
  const {artikel, wort, jamak} = word;
  const kasusList = [
    {key:"nom", label:"Nominativ"},
    {key:"gen", label:"Genitiv"},
    {key:"dat", label:"Dativ"},
    {key:"akk", label:"Akkusativ"},
  ];
  return kasusList.map(k=>{
    let sg = "–";
    if(artikel && ARTIKEL_DEKLINASI[artikel]){
      const nomenForm = k.key==="gen" ? nomenGenitivSingular(wort, artikel) : wort;
      sg = ARTIKEL_DEKLINASI[artikel][k.key] + " " + nomenForm;
    } else if(!artikel){
      sg = "–";
    }
    let pl = "–";
    const plWort = jamak && jamak.trim() ? jamak.trim() : (!artikel ? wort : "");
    if(plWort){
      const nomenForm = k.key==="dat" ? nomenDativPlural(plWort) : plWort;
      pl = PLURAL_DEKLINASI[k.key] + " " + nomenForm;
    }
    return {label:k.label, sg, pl};
  });
}

function migrateData(d){
  if(d && Array.isArray(d.categories)){
    d.categories.forEach(c=>{
      (c.words||[]).forEach(w=>{ if(typeof w.jamak !== "string") w.jamak = ""; });
    });
  }
  return d;
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrateData(JSON.parse(raw));
  }catch(e){}
  saveData(SEED);
  return SEED;
}
function saveData(d){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }catch(e){}
}

let kamusQuery = "";

function renderKamus(){
  const wrap = document.getElementById("kamus-wrap");

function renderKamusResults(){
  const results = document.getElementById("kamus-results");
  if(!results) return;
  const q = kamusQuery.trim().toLowerCase();
  let html = "";

  let anyVisible = false;
  data.categories.forEach(cat=>{
    let words = sortWords(cat.words).filter(w=>
      !q || w.wort.toLowerCase().includes(q) || w.arti.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q)
    );
    if(q && words.length===0) return;
    anyVisible = true;
    const isOpen = openCats.has(cat.id) || !!q;
    html += '<div class="cat-section">';
    html += '<button class="cat-header" data-cat="'+cat.id+'">';
    html += '<span class="cat-header-left"><span class="chev '+(isOpen?"":"closed")+'">▾</span><span class="cat-name">'+esc(cat.name)+'</span></span>';
    html += '<span class="cat-count">'+words.length+'</span></button>';

      html += '<div class="word-grid">';
      if(words.length===0) html += '<div class="empty-row">Tidak ada kata yang cocok.</div>';
      words.forEach(w=>{
        const a = ARTIKEL[w.artikel] || ARTIKEL[""];
        html += '<button class="word-card" data-detail="'+w.id+'"><span class="tag '+a.cls+'">'+a.label+'</span>';

    html += '<div class="empty-state">Tidak ada hasil untuk "'+esc(kamusQuery)+'".</div>';
  }

  results.innerHTML = html;

  results.querySelectorAll(".cat-header").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.cat;
      if(openCats.has(id)) openCats.delete(id); else openCats.add(id);

  });
}

  return null;
}
function openWordDetail(id){

function closeWordDetail(){

}
function renderWordDetail(){
  const overlay = document.getElementById("word-modal-overlay");
  if(!overlay || !detailWordId) return;
  const found = findWordById(detailWordId);
  if(!found){ closeWordDetail(); return; }
  const {word, catName} = found;
  const a = ARTIKEL[word.artikel] || ARTIKEL[""];
  const rows = buildDeklinasiTable(word);

  let html = '<div class="modal-sheet">';
  html += '<div class="modal-head"><div><span class="tag '+a.cls+'">'+a.label+'</span> <span class="modal-word">'+esc(word.wort)+'</span></div>';
  html += '<button class="icon-btn" id="close-modal-btn">✕</button></div>';

  rows.forEach(r=>{

  });
  html += '</tbody></table>';
  html += '<div class="deklinasi-note">Tabel mengikuti pola deklinasi artikel tentu secara umum. Kata benda tak beraturan (mis. deklinasi lemah/n-Deklination) bisa berbeda.</div>';
  html += '</div>';

  overlay.innerHTML = html;
  overlay.classList.remove("hidden");

  const closeBtn = document.getElementById("close-modal-btn");
  if(closeBtn) closeBtn.addEventListener("click", closeWordDetail);
  overlay.onclick = e=>{ if(e.target===overlay) closeWordDetail(); };

function resetForm(){
  formState = {artikel:"", wort:"", arti:"", jamak:""};
  artikelTouched = false;
  jamakTouched = false;
  editingWordId = null;
  duplicateInfo = null;
  duplicateConfirmed = false;
  translating = false;
}

function findDuplicate(wort){
  const w = norm(wort);
  if(!w) return null;
  for(const cat of data.categories){
    for(const word of cat.words){
      if(word.id===editingWordId) continue;
      if(norm(word.wort)===w) return {catName:cat.name, word};
    }
  }
  return null;
}

function buildJamakFieldHtml(){
  const knownEntry = lookupKnownWord(formState.wort);
  let html = "";
  if(formState.artikel){
    html += '<input id="jamak-input" placeholder="Bentuk jamak (plural), mis. '+(guessPlural(formState.wort||"x",formState.artikel)||"...")+'" value="'+esc(formState.jamak)+'" />';
    if(formState.jamak && !jamakTouched && formState.wort.trim()){
      if(knownEntry && knownEntry.jamak) html += '<span class="guess-note">✅ bentuk jamak dari kamus internal</span>';
      else html += '<span class="guess-note">🔮 tebakan otomatis — boleh diedit kalau salah</span>';
    }
  } else if(formState.wort.trim()){
    html += '<span class="guess-note">Kata "kata jamak" — dianggap sudah berbentuk jamak, tidak perlu isi plural.</span>';
  }
  return html;
}

    ["der","die","das",""].forEach(a=>{

      const style = active
        ? 'style="background:var(--'+(a||"none")+'-bg);color:var(--'+(a||"none")+'-fg);border-color:var(--'+(a||"none")+'-bg);"'

async function autoTranslate(){
  const wi = document.getElementById("word-input");
  const ai = document.getElementById("arti-input");
  const wort = wi ? wi.value.trim() : formState.wort.trim();
  if(!wort) return;
  translating = true;
  renderKelola();
  const wiAfter = document.getElementById("word-input");
  if(wiAfter) wiAfter.focus();
  try{
    const res = await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(wort)+"&langpair=de|id");
    const json = await res.json();
    const translated = json && json.responseData && json.responseData.translatedText;
    if(translated){
      formState.arti = translated;
    }
  }catch(e){
    // gagal terhubung / offline — biarkan pengguna isi manual
  }
  translating = false;
  formState.wort = wort;
  renderKelola();
  const ai2 = document.getElementById("arti-input");
  if(ai2){ ai2.focus(); ai2.selectionStart = ai2.selectionEnd = ai2.value.length; }
}

function attachKelolaHandlers(){
  const wrap = document.getElementById("kelola-wrap");
  if(!wrap) return;

  wrap.querySelectorAll("[data-select]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ selectedCatId = btn.dataset.select; resetForm(); renderKelola(); });
  });
  wrap.querySelectorAll("[data-askdel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ confirmDeleteCat = btn.dataset.askdel; renderKelola(); });
  });
  const cancelDel = wrap.querySelector("[data-canceldel]");
  if(cancelDel) cancelDel.addEventListener("click", ()=>{ confirmDeleteCat=null; renderKelola(); });
  wrap.querySelectorAll("[data-confirmdel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.dataset.confirmdel;
      data.categories = data.categories.filter(c=>c.id!==id);
      confirmDeleteCat = null;
      if(selectedCatId===id) selectedCatId = data.categories[0] ? data.categories[0].id : null;
      resetForm();
      persist(); renderKelola();
    });
  });

  const addCatBtn = document.getElementById("add-cat-btn");
  const newCatInput = document.getElementById("new-cat-input");
  function addCategory(){
    if(!newCatInput) return;
    const name = newCatInput.value.trim();
    if(!name) return;
    const newCat = {id: uid("cat"), name, words:[]};
    data.categories.push(newCat);
    selectedCatId = newCat.id;
    resetForm();
    persist(); renderKelola();
  }
  if(addCatBtn) addCatBtn.addEventListener("click", addCategory);
  if(newCatInput) newCatInput.addEventListener("keydown", e=>{ if(e.key==="Enter") addCategory(); });

  wrap.querySelectorAll("[data-artikel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      formState.artikel = btn.dataset.artikel;
      artikelTouched = true;
      const wi = document.getElementById("word-input"), ai = document.getElementById("arti-input"), ji = document.getElementById("jamak-input");
      if(wi) formState.wort = wi.value;
      if(ai) formState.arti = ai.value;
      if(ji) formState.jamak = ji.value;
      if(!jamakTouched) formState.jamak = guessPlural(formState.wort, formState.artikel);
      renderKelola();
    });
  });

  function renderJamakContainer(){
    const container = document.getElementById("jamak-container");
    if(!container) return;
    container.innerHTML = buildJamakFieldHtml();
    const ji = document.getElementById("jamak-input");
    if(ji){
      ji.addEventListener("input", e=>{ formState.jamak = e.target.value; jamakTouched = true; });
      ji.addEventListener("keydown", e=>{ if(e.key==="Enter") saveWord(); });
    }
  }

  const wordInput = document.getElementById("word-input");
  const artiInput = document.getElementById("arti-input");
  renderJamakContainer();
  if(wordInput){
    wordInput.addEventListener("input", e=>{
      formState.wort = e.target.value;
      duplicateInfo = null; duplicateConfirmed = false;
      const knownEntry = lookupKnownWord(formState.wort);
      if(!artikelTouched){
        formState.artikel = guessArtikel(formState.wort);
        const picker = wrap.querySelector(".artikel-picker");
        if(picker){
          wrap.querySelectorAll("[data-artikel]").forEach(b=>{
            const a = b.dataset.artikel;
            const active = formState.artikel===a;
            b.style.background = active ? "var(--"+(a||"none")+"-bg)" : "transparent";
            b.style.color = active ? "var(--"+(a||"none")+"-fg)" : "var(--ink)";
            b.classList.toggle("tag-guess", active && a!=="" && !knownEntry);
          });
          const note = wrap.querySelector(".artikel-picker .guess-note");
          const shouldShowNote = formState.artikel && formState.wort.trim();
          const noteText = knownEntry ? "✅ artikel dari kamus internal" : "🔮 tebakan otomatis — ketuk der/die/das kalau salah";
          if(shouldShowNote && !note){
            const span = document.createElement("span");
            span.className = "guess-note";
            span.textContent = noteText;
            picker.appendChild(span);
          } else if(shouldShowNote && note){
            note.textContent = noteText;
          } else if(!shouldShowNote && note){
            note.remove();
          }
        }
      }
      if(!jamakTouched){
        formState.jamak = guessPlural(formState.wort, formState.artikel);
      }
      // Hanya bagian kecil kolom jamak yang dibangun ulang di sini — bukan
      // seluruh form — supaya kolom kata (yang sedang diketik) tidak pernah
      // dihancurkan-dan-dibuat-ulang dan keyboard HP tidak tertutup.
      renderJamakContainer();
    });
    wordInput.addEventListener("blur", ()=>{
      if(!formState.arti.trim() && formState.wort.trim()) autoTranslate();
    });
  }
  if(artiInput){
    artiInput.addEventListener("input", e=>{ formState.arti = e.target.value; });
    artiInput.addEventListener("keydown", e=>{ if(e.key==="Enter") saveWord(); });
  }
  const translateBtn = document.getElementById("translate-btn");
  if(translateBtn) translateBtn.addEventListener("click", autoTranslate);

  const saveBtn = document.getElementById("save-word-btn");
  if(saveBtn) saveBtn.addEventListener("click", saveWord);
  const cancelEditBtn = document.getElementById("cancel-edit-btn");
  if(cancelEditBtn) cancelEditBtn.addEventListener("click", ()=>{ resetForm(); renderKelola(); });

  const confirmDupBtn = document.getElementById("confirm-dup-btn");
  if(confirmDupBtn) confirmDupBtn.addEventListener("click", ()=>{ duplicateConfirmed = true; saveWord(); });
  const cancelDupBtn = document.getElementById("cancel-dup-btn");
  if(cancelDupBtn) cancelDupBtn.addEventListener("click", ()=>{ duplicateInfo = null; duplicateConfirmed = false; renderKelola(); });

  wrap.querySelectorAll("[data-editword]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const cat = data.categories.find(c=>c.id===selectedCatId);
      const w = cat ? cat.words.find(w=>w.id===btn.dataset.editword) : null;
      if(!w) return;
      editingWordId = w.id;
      formState = {artikel:w.artikel, wort:w.wort, arti:w.arti, jamak:w.jamak||""};
      artikelTouched = true;
      jamakTouched = true;
      duplicateInfo = null; duplicateConfirmed = false;
      renderKelola();
    });
  });
  wrap.querySelectorAll("[data-delword]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const cat = data.categories.find(c=>c.id===selectedCatId);
      if(!cat) return;
      cat.words = cat.words.filter(w=>w.id!==btn.dataset.delword);
      if(editingWordId===btn.dataset.delword) resetForm();
      persist(); renderKelola();
    });
  });

  function saveWord(){
    const cat = data.categories.find(c=>c.id===selectedCatId);
    if(!cat) return;
    const wordInputEl = document.getElementById("word-input");
    const artiInputEl = document.getElementById("arti-input");
    const wort = (wordInputEl ? wordInputEl.value : formState.wort || "").trim();
    const arti = (artiInputEl ? artiInputEl.value : formState.arti || "").trim();
    if(!wort || !arti) return;

    if(!duplicateConfirmed){
      const dup = findDuplicate(wort);
      if(dup){ duplicateInfo = dup; renderKelola(); return; }
    }

    const jamak = (document.getElementById("jamak-input") ? document.getElementById("jamak-input").value : formState.jamak || "").trim();
    if(editingWordId){
      const w = cat.words.find(w=>w.id===editingWordId);
      if(w){ w.artikel = formState.artikel; w.wort = wort; w.arti = arti; w.jamak = jamak; }
    } else {
      cat.words.push({id:uid("w"), artikel:formState.artikel, wort, arti, jamak});
    }
    resetForm();
    persist(); renderKelola();
  }
}

/* ---------------- MENU 3: FLASHCARD ---------------- */
function allWords(){
  return data.categories.flatMap(c=>c.words.map(w=>({...w, catName:c.name})));
}
function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildDeck(filter, shuffle){
  const words = allWords();
  const src = filter==="all" ? words : words.filter(w=>w.catName===filter);
  return shuffle ? shuffleArray(src) : src;
}

function renderFlashcard(){
  const wrap = document.getElementById("flash-wrap");
  if(!wrap) return;
  const words = allWords();
  if(words.length===0){
    wrap.innerHTML = '<div class="empty-state">Belum ada kosakata untuk dijadikan flashcard. Tambahkan kata di menu Kelola dulu.</div>';
    return;
  }

  let html = '<div class="flash-controls">';
  html += '<select id="flash-filter">';
  html += '<option value="all"'+(flashFilter==="all"?" selected":"")+'>Semua tema ('+words.length+')</option>';
  data.categories.forEach(c=>{
    html += '<option value="'+esc(c.name)+'"'+(flashFilter===c.name?" selected":"")+'>'+esc(c.name)+' ('+c.words.length+')</option>';
  });
  html += '</select>';
  html += '<button class="btn btn-ghost" id="reshuffle-btn">🔀 Acak ulang</button></div>';

  const current = flashDeck[flashIndex];
  if(!current){
    html += '<div class="empty-state">Tidak ada kata pada tema ini.</div>';
    wrap.innerHTML = html;
    attachFlashHandlers();
    return;
  }

  html += '<div class="flash-counter">Kartu '+(flashIndex+1)+' dari '+flashDeck.length+' · '+esc(current.catName)+'</div>';
  html += '<div class="flash-stage" id="flash-stage">';
  html += '<div class="flash-card '+(flashFlipped?"flipped":"")+'" id="flash-card">';
  const a = ARTIKEL[current.artikel] || ARTIKEL[""];
  html += '<div class="flash-face"><span class="tag '+a.cls+'">'+a.label+'</span>';
  html += '<div class="flash-word">'+esc(current.wort)+'</div><div class="flash-hint">ketuk untuk lihat arti</div></div>';
  html += '<div class="flash-face flash-face-back"><div class="flash-word">'+esc(current.arti)+'</div><div class="flash-hint">ketuk untuk kembali</div></div>';
  html += '</div></div>';
  html += '<div class="flash-nav"><button class="nav-btn" id="flash-prev">‹</button><button class="nav-btn" id="flash-flip">⟳</button><button class="nav-btn" id="flash-next">›</button></div>';

  wrap.innerHTML = html;
  attachFlashHandlers();
}

function attachFlashHandlers(){
  const wrap = document.getElementById("flash-wrap");
  if(!wrap) return;
  const filterSel = document.getElementById("flash-filter");
  if(filterSel) filterSel.addEventListener("change", e=>{
    flashFilter = e.target.value;
    flashDeck = buildDeck(flashFilter, true);
    flashIndex = 0; flashFlipped = false;
    renderFlashcard();
  });
  const reshuffleBtn = document.getElementById("reshuffle-btn");
  if(reshuffleBtn) reshuffleBtn.addEventListener("click", ()=>{
    flashDeck = shuffleArray(flashDeck); flashIndex=0; flashFlipped=false; renderFlashcard();
  });
  const stage = document.getElementById("flash-stage");
  if(stage) stage.addEventListener("click", ()=>{ flashFlipped = !flashFlipped; renderFlashcard(); });
  const prev = document.getElementById("flash-prev");
  if(prev) prev.addEventListener("click", e=>{ e.stopPropagation(); flashFlipped=false; flashIndex = flashIndex-1>=0 ? flashIndex-1 : flashDeck.length-1; renderFlashcard(); });
  const next = document.getElementById("flash-next");
  if(next) next.addEventListener("click", e=>{ e.stopPropagation(); flashFlipped=false; flashIndex = flashIndex+1<flashDeck.length ? flashIndex+1 : 0; renderFlashcard(); });
  const flip = document.getElementById("flash-flip");
  if(flip) flip.addEventListener("click", e=>{ e.stopPropagation(); flashFlipped=!flashFlipped; renderFlashcard(); });
}

/* ---------------- INIT ---------------- */
renderHeader();
renderKamus();
</script>
